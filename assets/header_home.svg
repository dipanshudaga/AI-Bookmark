<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 96" width="440" height="96" fill="none">
  <defs>
    <!-- Steeper Arch Path for condensed tall Fillmore lettering -->
    <path id="archTall" d="M 40 68 Q 185 24 330 68" fill="none"/>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5426D6"/>
      <stop offset="100%" stop-color="#38108A"/>
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Righteous&amp;display=swap');
    .tall-wordmark {
      font-family: 'Righteous', 'Arial Black', Impact, sans-serif;
      font-size: 34px;
      font-weight: 900;
      fill: url(#violetGrad);
      letter-spacing: -0.025em;
    }
    .tall-offset {
      font-family: 'Righteous', 'Arial Black', Impact, sans-serif;
      font-size: 34px;
      font-weight: 900;
      fill: #D9F76A;
      letter-spacing: -0.025em;
      opacity: 0.95;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 9.5px;
      font-weight: 800;
      fill: #21143F;
      letter-spacing: 0.16em;
    }
    .burst-num {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 800;
      fill: #28330C;
    }
    .burst-lbl {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 8px;
      font-weight: 700;
      fill: #28330C;
    }
  </style>

  <rect width="440" height="96" fill="#FBF8F0"/>

  <!-- Top Right Organic Psychedelic Waves -->
  <path d="M 270 0 C 300 20, 335 24, 370 10 C 390 2, 415 12, 440 24 L 440 0 Z" fill="#D9F76A"/>
  <path d="M 320 0 C 345 22, 380 26, 410 14 L 440 68 C 426 64, 418 50, 400 52 C 380 56, 368 76, 345 72 C 330 68, 322 52, 305 38 C 290 24, 300 4, 320 0 Z" fill="#5426D6"/>
  <path d="M 405 40 C 420 46, 432 58, 440 70 L 440 38 Z" fill="#D9F76A"/>

  <!-- Top Left Organic Waves -->
  <path d="M 0 0 L 80 0 C 66 14, 50 18, 36 12 C 22 6, 10 20, 0 32 Z" fill="#D9F76A" opacity="0.85"/>
  <path d="M 0 0 L 36 0 C 32 16, 18 24, 0 28 Z" fill="#5426D6"/>

  <!-- Bookmark Ribbon on Left -->
  <g transform="translate(16, 12)">
    <path d="M 0 3 C 0 1.34 1.34 0 3 0 H 21 C 22.66 0 24 1.34 24 3 V 33 L 12 25 L 0 33 V 3 Z" fill="#5426D6"/>
    <circle cx="12" cy="10" r="3.2" fill="#D9F76A"/>
  </g>

  <!-- Arched Wordmark with Fillmore scale -->
  <g transform="translate(0, -6) scale(1, 1.25)">
    <!-- Offset lime shadow -->
    <text dy="-1.5">
      <textPath href="#archTall" startOffset="50%" text-anchor="middle" class="tall-offset">
        AI BOOKMARKS
      </textPath>
    </text>
    <!-- Deep violet wordmark -->
    <text dy="0">
      <textPath href="#archTall" startOffset="50%" text-anchor="middle" class="tall-wordmark">
        AI BOOKMARKS
      </textPath>
    </text>
  </g>

  <!-- Centered Subtitle -->
  <text x="185" y="80" text-anchor="middle" class="subtitle">
    FIND ANYTHING YOU SAVED
  </text>

  <!-- Starburst Badge with organic rounded petals -->
  <g transform="translate(325, 8)">
    <path d="M 25 0 
             C 31 1, 37 5, 41 10 
             C 46 15, 50 19, 52 26 
             C 54 32, 50 39, 46 44 
             C 42 49, 37 55, 30 57 
             C 24 59, 17 56, 12 51 
             C 6 47, 1 42, 0 35 
             C -1 28, 2 22, 5 16 
             C 8 11, 14 5, 20 1 Z" 
          fill="#D9F76A"/>
    <text x="25" y="25" text-anchor="middle" class="burst-num" id="homeCountNumber">142</text>
    <text x="25" y="35" text-anchor="middle" class="burst-lbl">indexed</text>
  </g>
</svg>